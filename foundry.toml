[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"

# The factory embeds the pool's creation bytecode, so runs are tuned to keep the
# factory under the 24KB Spurious Dragon deploy limit.
optimizer = true
optimizer_runs = 200

# Concentrated-liquidity math relies on unchecked overflow semantics in a handful
# of hot paths; the via-IR pipeline keeps stack usage in check.
via_ir = true
evm_version = "cancun"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

# CI has the budget for a deeper search than a local run should pay for.
[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
